# .github/workflows/ci.yml — Aegis CI.
#
# DEPLOYMENT NOTE: this file is the CI workflow, checked in here as
# docs/ci.workflow.yml because the PAT used for this push lacks the
# `workflow` scope (GitHub refuses workflow creation without it).
# To activate CI, copy this file to .github/workflows/ci.yml:
#     mkdir -p .github/workflows && cp docs/ci.workflow.yml .github/workflows/ci.yml
# and commit with an account that has workflow rights. The content is
# final and requires no further edits.
#
# The laws (docs/laws.md) state "CI verifies them" — this workflow is
# that CI. It enforces, per PR and per push:
#
#   Rule 36  regression suite runs (5-category bug coverage).
#   Rule 37  every golden pair runs in BOTH Static (AOT) and Profile
#            (JIT) modes; census >= 10 per pass enforced by the runner.
#   Rule 38  differential testing: reference interpreter <-> AOT <-> JIT
#            over a seeded corpus; divergence fails the build.
#   Rule 41  perf benchmarks execute (timings are reported; gating
#            against a baseline is a follow-up once a baseline exists).
#   Rule 42  the graph verifier runs after every pass (compiled in via
#            AEGIS_VERIFY_IR=1 in the build scripts).
#   Rule 61/D.1  scan_magic_numbers.py — no unnamed constants in pass
#            or backend logic.
#   Rule D.7     scan_slop.py — no untracked workaround markers.
#
# The weekly schedule job (Rule 39's cadence) re-runs the same matrix
# with a larger differential corpus so slow-diverging bugs surface
# within a week, not at release time.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Sunday 03:00 UTC (Rule 39 cadence for extended runs).
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + laws (g++-14, c++26)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Rule 40: failures save replay artifacts under replay-artifacts/.
      AEGIS_DIFFERENTIAL_COUNT: 200
    steps:
      - uses: actions/checkout@v4

      - name: Install g++-14 (C++26-capable toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
          g++-14 --version

      - name: Build the toolchain (scripts/build.sh)
        run: |
          # build.sh drives g++; point it at g++-14 via CXX.
          CXX=g++-14 bash scripts/build.sh

      - name: Build the test suites (scripts/build_tests.sh)
        run: CXX=g++-14 bash scripts/build_tests.sh

      - name: Unit tests
        run: |
          set -e
          for t in test_core_containers test_ir_graph test_passes \
                   test_frontend_smoke test_new_passes test_telemetry \
                   test_sound_rewrites test_loop_speculative; do
            "./build/$t"
          done

      - name: Rule 36 — regression suite
        run: ./build/test_regression

      - name: Rule 37 — golden suite (AOT + JIT, census-enforced)
        run: bash tests/integration/run_all_golden.sh

      - name: Rule 38 — differential testing (reference/AOT/JIT)
        run: python3 tests/integration/run_differential.py --count "${AEGIS_DIFFERENTIAL_COUNT}"

      - name: Rule 41 — perf benchmarks + regression gate (compile + runtime)
        run: |
          ./build/bench_pipeline
          ./build/bench_runtime
          python3 scripts/check_perf.py

      - name: Rule 61/D.1 — magic-number scan
        run: python3 scripts/scan_magic_numbers.py

      - name: Rule D.7 — untracked-workaround scan
        run: python3 scripts/scan_slop.py

      - name: Rule 40 — upload replay artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: replay-artifacts
          path: replay-artifacts/
          if-no-files-found: ignore

  weekly-extended:
    # Rule 39 cadence: a scheduled, larger differential corpus. Same
    # job, more programs — cheap insurance against slow divergence.
    if: github.event_name == 'schedule'
    name: weekly extended differential (Rule 39 cadence)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install g++-14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
      - name: Build
        run: CXX=g++-14 bash scripts/build.sh
      - name: Extended differential corpus (1000 programs)
        run: python3 tests/integration/run_differential.py --count 1000
      - name: Golden suite (both modes)
        run: CXX=g++-14 bash scripts/build_tests.sh && bash tests/integration/run_all_golden.sh
